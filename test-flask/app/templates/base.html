<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome-7.3.1-web/css/all.min.css') }}" />
</head>
<body>
    <nav class="topbar">
        <div class="topbar-inner">
            <div class="brand">SecureApp</div>
            <div class="nav-links">
                <a href="{{ url_for('views.home') }}">Home</a>
                <a href="{{ url_for('views.about') }}">About</a>
                {% if current_user.is_authenticated %}
                    <span class="user-pill">{{ current_user.email }}</span>
                    <a href="{{ url_for('auth.logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="page-shell">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
